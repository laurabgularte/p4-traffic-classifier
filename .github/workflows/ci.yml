name: P4 Code Validation & Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  p4-compile-check:
    name: Validate P4 Syntax and Build Artifacts
    runs-on: ubuntu-latest
    container:
      image: p4lang/p4c:latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Compilar código P4
        run: |
          mkdir -p build
          p4c-bm2-ss --p4v 16 --p4runtime-files build/classifier.p4info.txt -o build/classifier.json p4src/classifier.p4

      - name: Verificar se os artefactos compilados foram gerados
        run: |
          if [ -f "build/classifier.json" ] && [ -f "build/classifier.p4info.txt" ]; then
            echo "✔ Compilação do P4 concluída com sucesso!"
          else
            echo "✖ Falha: Artefactos do P4 não foram encontrados."
            exit 1
          fi
